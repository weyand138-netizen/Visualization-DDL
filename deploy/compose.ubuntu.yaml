services:
  ddl:
    build: ..
    restart: unless-stopped
    environment:
      DDL_PASSWORD: ${DDL_PASSWORD:?Set a dashboard password}
      DDL_USERS_JSON: ${DDL_USERS_JSON:-}
      TZ: Asia/Shanghai
    volumes:
      - ddl-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8080),5).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DDL_DOMAIN: ${DDL_DOMAIN:?Set the public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ddl:
        condition: service_healthy
volumes:
  ddl-data:
  caddy-data:
  caddy-config:
