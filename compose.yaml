services:
  ddl:
    build: .
    restart: unless-stopped
    ports:
      - "${DDL_BIND:-127.0.0.1}:${DDL_PORT:-8080}:8080"
    environment:
      DDL_PASSWORD: ${DDL_PASSWORD:-}
      DDL_USERS_JSON: ${DDL_USERS_JSON:-}
      DDL_BOT_TOKEN: ${DDL_BOT_TOKEN:-}
      DDL_AI_URL: ${DDL_AI_URL:-}
    volumes:
      - ddl-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8080),5).close()"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  ddl-data:
