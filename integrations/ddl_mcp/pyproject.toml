[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visualization-ddl-mcp"
version = "1.1.0"
description = "Account-scoped DDL calendar tools for AIRI and other MCP hosts"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0"]
license = "MIT"
authors = [{name = "weyand138-netizen"}]
readme = "README.md"

[project.scripts]
ddl-mcp = "ddl_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
